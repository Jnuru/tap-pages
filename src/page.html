<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="{{bg}}">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{fontUrl}}" rel="stylesheet">
<style>
  :root{
    --bg:{{bg}}; --ink:{{ink}}; --accent:{{accent}}; --on-accent:{{onAccent}};
    --mute:color-mix(in srgb, var(--ink) 55%, var(--bg));
    --line:color-mix(in srgb, var(--ink) 16%, var(--bg));
    --press:color-mix(in srgb, var(--ink) 6%, var(--bg));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"{{font}}", Georgia, serif;
    min-height:100dvh; display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:420px; padding:48px 24px calc(40px + env(safe-area-inset-bottom))}

  .label{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute)}

  header{display:flex; flex-direction:column; align-items:center; text-align:center}
  .logo{display:block; max-width:180px; max-height:56px; width:auto; height:auto; margin-bottom:32px}
  .logo.solo{max-width:240px; max-height:120px; margin-bottom:36px}
  .avatar{
    width:128px; height:128px; border-radius:50%; overflow:hidden;
    border:1px solid var(--line); display:grid; place-items:center; margin-bottom:28px;
    background:var(--bg);
  }
  .avatar img{width:100%; height:100%; object-fit:cover}
  .mono{font-variation-settings:"opsz" 60; font-weight:440; font-size:46px; letter-spacing:-.06em; line-height:1}
  h1{font-weight:440; font-variation-settings:"opsz" 40; font-size:32px; letter-spacing:-.01em; line-height:1.1}
  .sub{margin-top:10px}
  .pitch{margin-top:20px; font-size:18px; line-height:1.45; max-width:30ch}

  .actions{margin-top:36px; display:grid; gap:10px}
  .btn{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    text-decoration:none; color:inherit; font-size:17px;
    padding:18px 20px; border-radius:14px; border:1px solid var(--ink);
    transition:background .15s, transform .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .btn.primary:active{filter:brightness(.88)}
  .btn:not(.primary):active{background:var(--press)}
  .btn small{display:block; font-size:13px; opacity:.7; margin-top:3px}
  .arrow{font-size:20px; line-height:1}

  .links{margin-top:40px; list-style:none; border-top:1px solid var(--line)}
  .links a{
    display:grid; grid-template-columns:34px 1fr auto; align-items:baseline; gap:8px;
    padding:17px 2px; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit; font-size:17px;
  }
  .links a:active{background:var(--press)}
  .links .n{font-size:11px; color:var(--mute); letter-spacing:.08em}
  .links .v{font-size:14px; color:var(--mute); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px}
  .lbl{display:inline-flex; align-items:center; gap:10px}
  .ico{width:16px; height:16px; flex:none; background:var(--ink); display:inline-block; -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}
{{iconCss}}
  footer{margin-top:44px; text-align:center; display:grid; gap:14px}
  footer a{color:inherit; text-decoration:none}
  .credit{font-size:10px; letter-spacing:.14em; opacity:.75}
</style>
</head>
<body>
<main>
  <header>
{{header}}
  </header>

  <div class="actions">
{{actions}}
  </div>
{{links}}
{{footer}}
</main>
</body>
</html>
